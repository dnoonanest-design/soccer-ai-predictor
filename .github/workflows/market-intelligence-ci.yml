name: Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/market-intelligence-layer, fix/railway-runtime-validation]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations on a clean database twice
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          pnpm migrate
          pnpm migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Railway bundle
        run: pnpm railway:build

      - name: Smoke test production bundle
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          # Keep provider readiness in its pre-check "unknown" state. All
          # provider-calling background jobs are disabled or delayed beyond
          # this local smoke test, so this value is never sent externally.
          API_FOOTBALL_KEY: ci-placeholder-not-a-real-key
          ADMIN_SECRET: ci-admin-secret
          BACKGROUND_LEARNER_ENABLED: "true"
          PREDICTION_ACCURACY_AUDIT_ENABLED: "false"
          FUTURE_PREDICTION_BASELINE_ENABLED: "false"
          FULL_MATCH_LIFECYCLE_TEST_ENABLED: "false"
          MARKET_FUTURE_SAMPLER_ENABLED: "false"
          NODE_ENV: production
          PORT: "3100"
        run: |
          set -euo pipefail
          pnpm railway:start > /tmp/soccer-api.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/healthz >/dev/null && \
               curl --fail --silent http://127.0.0.1:3100/api/health/readiness >/dev/null; then
              echo "Production bundle liveness and readiness checks passed"
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Production bundle exited before becoming healthy"
              cat /tmp/soccer-api.log
              exit 1
            fi
            sleep 1
          done
          echo "Production bundle did not become healthy in time"
          cat /tmp/soccer-api.log
          exit 1

      - name: Build production Docker image
        run: docker build -t soccer-ai-predictor:ci .

  macos-compatibility:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies on macOS
        run: pnpm install --frozen-lockfile

      - name: Typecheck on macOS
        run: pnpm typecheck

      - name: Test on macOS
        run: pnpm test

      - name: Build dashboard and API on macOS
        run: pnpm railway:build

  release-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs: [build, macos-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create Railway release marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$GITHUB_SHA" > .railway-release
          git add .railway-release
          if git diff --cached --quiet; then
            echo "Validated commit is already marked for production"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Release validated $GITHUB_SHA [skip ci]"
          git push origin HEAD:main
