[build]

buildCommand = "corepack enable && corepack prepare pnpm@11.19.0 --activate && pnpm install --frozen-lockfile && pnpm run railway:build"

[deploy]
preDeployCommand = ["pnpm run migrate"]
startCommand = "pnpm run railway:start"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
